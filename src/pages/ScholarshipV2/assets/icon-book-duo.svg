        d="M0 0v355.5C0 385.6-24.4 410-54.5 410H-205V60h60.147A204.85 204.85 0 0 0 0 0M0 0a204.85 204.85 0 0 0 144.853 60H205v350H54.5C24.4 410 0 385.6 0 355.5z"
        transform="translate(256 51)"
      />
      <path d="M0 0h125" transform="translate(91 201)" />
