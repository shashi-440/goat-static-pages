        d="M0 0c-94.899 20.494-148.16-26.985-200.003-88.496 35.8 8.419 86.424-.226 114.599-31.124"
        transform="translate(210.018 397.375)"
      />
      <path
        d="M0 0c20.493-94.874-26.984-148.135-88.493-200.008 8.446 35.8-.228 86.455-31.095 114.602"
        transform="translate(397.35 210.008)"
      />
      <path
        d="M0 0c-24.773 24.774-64.882 24.774-89.655 0-24.746-24.746-24.746-64.884 0-89.63 24.773-24.746 64.882-24.746 89.655 0C24.745-64.884 24.745-24.746 0 0"
