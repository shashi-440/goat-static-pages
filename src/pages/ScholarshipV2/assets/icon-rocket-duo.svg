<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 682.667 682.667" fill="none">
  <!--
    Same pink duotone as icon-book-duo.svg: solid #FDC8D3 behind a #202020 outline.

    Geometry is the supplied icon untouched — the 1.33333 flip transform maps the
    512 drawing space onto the 682.667 viewBox, and every path also carries its own
    translate, so none of these coordinates can be read without both.

    The source's clipPath is dropped: it clipped to the full 512 square, so it never
    removed anything.
  -->
  <g transform="matrix(1.33333 0 0 -1.33333 0 682.667)">
    <!-- Blush layer: the exhaust plume and the nose cone's fill. -->
    <g fill="#FDC8D3" fill-rule="evenodd">
      <path
        d="M0 0c30.981-4.479 72.875 4.28 105.047 20.466 32.654 16.412 55.301 48.159 56.208 78.829l-61.962 61.993c-30.698-.935-62.444-23.556-78.856-56.238C4.28 72.906-4.479 30.982 0 0"
        transform="translate(19.709 19.694)"
      />
      <path
        d="M0 0c16.554-53.517 64.344-101.336 117.859-117.862a251 251 0 0 1 3.26 21.316c2.324 21.174 2.862 43.114 1.445 65.763-1.616 25.709-9.779 33.873-35.46 35.489-22.675 1.389-44.615.878-65.789-1.446C14.116 2.466 7.029 1.361 0 0"
        transform="translate(378.643 496.528)"
      />
    </g>

    <g
      fill="none"
      stroke="#202020"
      stroke-width="20.176"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-miterlimit="10"
    >
      <path
        d="M0 0c135.348 53.347 275.798 161.203 291.955 307.836 2.324 21.174 2.862 43.114 1.445 65.763-1.616 25.709-9.779 33.873-35.46 35.488-22.675 1.39-44.615.879-65.789-1.445-146.6-16.157-254.453-156.611-307.799-291.963Z"
        transform="translate(207.807 92.147)"
      />
